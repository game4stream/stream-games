<title>Stream-Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: sticky top bar, filter row, released/unreleased tabs, auto-fill grid of cover cards. One committed dark "stream" look. */
:root{
  --bg:#121117; --surface:#1a1920; --surface-2:#22212a; --line:#2d2b37;
  --fg:#edecf3; --muted:#9b98aa; --accent:#b48cff; --accent-ink:#170d2b;
  --danger:#ff6b7a;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--accent);display:flex;align-items:center;gap:10px}
.logo .dot{width:10px;height:10px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 4px color-mix(in srgb,#ff4d5e 22%,transparent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,#ff4d5e 6%,transparent)}}
.top-right{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.count{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

/* filters */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;padding-block:28px 14px}
.search{position:relative;flex:0 1 260px;min-width:0}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;color:var(--muted)}
.search input,.select,.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.search input{padding-left:36px}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.select{width:auto;margin-left:auto;min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:22px}
.chip{--h:260;border:1px solid transparent;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer;
  background:hsl(var(--h) 55% 50% / .14);color:hsl(var(--h) 85% 72%)}
.chip:hover{border-color:hsl(var(--h) 70% 60% / .5)}
.chip[aria-pressed="true"]{background:hsl(var(--h) 62% 46%);color:#fff}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:10px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:6px;font-weight:500}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px;padding-bottom:48px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card a.cover{display:block;aspect-ratio:460/215;max-width:100%;background:var(--surface-2);overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.gen{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px 18px;
  background:radial-gradient(120% 120% at 100% 0%,hsl(var(--h1) 60% 34%),transparent 60%),linear-gradient(135deg,hsl(var(--h2) 45% 20%),hsl(var(--h1) 40% 9%))}
.gen span{font-family:var(--display);font-weight:800;font-size:clamp(22px,4.2vw,34px);line-height:.95;letter-spacing:-.02em;color:#fff;text-wrap:balance;text-shadow:0 2px 18px rgb(0 0 0 / .45)}
.card-body{padding:16px 22px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.modes{display:flex;flex-wrap:wrap;gap:5px}
.mode{font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:#cfcdd9;border-radius:4px;padding:2px 6px}
.mode.ea{border-color:#c9a227;color:#f1cf5b;background:rgb(201 162 39 / .12)}
.checks{display:flex;flex-wrap:wrap;gap:12px 24px}
.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.card h3 a{color:inherit;text-decoration:none}
.note{color:var(--muted);margin:-2px 0 0}
.release{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{--h:260;background:hsl(var(--h) 62% 46%);color:#fff;border-radius:5px;padding:3px 8px;font-size:13px;font-weight:600}
.card.played .cover img,.card.played .gen{filter:grayscale(.85) brightness(.6)}
.stamp{position:absolute;left:12px;top:12px;z-index:2;background:rgb(0 0 0 / .7);color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:4px 8px;border:1px solid rgb(255 255 255 / .25)}
.admin-tools{position:absolute;right:10px;top:10px;z-index:3;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.card:hover .admin-tools,.card:focus-within .admin-tools{opacity:1}
@media (hover:none){.admin-tools{opacity:1}}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid rgb(255 255 255 / .2);background:rgb(15 14 20 / .8);color:#fff;cursor:pointer}
.icon-btn:hover{background:var(--accent);color:var(--accent-ink)}

.empty{grid-column:1/-1;text-align:center;padding:64px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;font-family:var(--display);font-size:24px;color:var(--fg);margin-bottom:6px}

/* dialog */
dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgb(5 4 10 / .7)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-family:var(--display);font-size:22px}
.dlg-body{padding:18px 22px;display:grid;gap:16px;overflow:auto}
.dlg-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line)}
.dlg-foot .right{display:flex;gap:10px;margin-left:auto}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row{grid-template-columns:1fr}.select{margin-left:0}}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.ok{color:#7fe0a8}.hint.err{color:var(--danger)}
.drop{position:relative;aspect-ratio:460/215;max-width:100%;border:1.5px dashed var(--line);border-radius:10px;overflow:hidden;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-2)}
.drop.over{border-color:var(--accent);color:var(--fg)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .msg{padding:12px;font-size:14px;position:relative}
.drop.has .msg{display:none}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle.g[aria-pressed="true"]{background:hsl(var(--h) 62% 46%);color:#fff;border-color:transparent}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);padding:8px 12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script id="app">
(() => {
"use strict";
const GAMES = (() => { try { return JSON.parse(document.getElementById("data").textContent) || []; } catch { return []; } })();
const GENRES = [["Horror",2],["Story",205],["Simulator",152],["Olympiaden",26],["Cozy",258],["Party Games",300],["VR",96],["Friendslop",238],["Roguelike",44],["Strategie",182],["Shooter",14],["Puzzle",272],["Survival",120],["Rennspiel",8],["Neu Release",350]];
const MODES = ["Singleplayer","Koop","Splitscreen","Multiplayer"];
const hueOf = g => { const k = GENRES.find(x => x[0].toLowerCase() === String(g).toLowerCase()); if (k) return k[1]; let h = 0; for (const c of String(g)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const uid = () => Math.random().toString(36).slice(2, 10);

const state = { q: "", showPlayed: false, mode: "", tags: new Set(), tab: "released", admin: false };
try { const s = JSON.parse(sessionStorage.getItem("sg-view") || "null"); if (s) { state.q = s.q || ""; state.showPlayed = !!s.showPlayed; state.mode = s.mode || ""; state.tab = s.tab || "released"; state.tags = new Set(s.tags || []); } } catch {}
const saveView = () => { try { sessionStorage.setItem("sg-view", JSON.stringify({ ...state, tags: [...state.tags] })); } catch {} };

let artifactApi = null, sampleApi = null, mcpApi = null, downloadsApi = null;
const root = document.getElementById("root");

const I = {
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  eye: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};

function filtered() {
  const q = state.q.trim().toLowerCase();
  return GAMES.filter(g => {
    if (!state.showPlayed && g.played) return false;
    if (state.mode && !(g.modes || []).includes(state.mode)) return false;
    if (state.tags.size && !(g.genres || []).some(t => state.tags.has(t))) return false;
    if (q && !`${g.title} ${g.note || ""} ${(g.genres || []).join(" ")}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
}

function cover(g) {
  if (g.image) return `<img src="${esc(g.image)}" alt="" loading="lazy">`;
  const gs = g.genres || [];
  const h1 = hueOf(gs[0] || g.title), h2 = hueOf(gs[1] || (g.title + "x"));
  return `<div class="gen" style="--h1:${h1};--h2:${h2}"><span>${esc(g.title)}</span></div>`;
}

function card(g) {
  const link = safeUrl(g.link);
  const a = link ? `href="${esc(link)}" target="_blank" rel="noopener"` : "";
  return `<article class="card${g.played ? " played" : ""}" data-id="${esc(g.id)}">
    ${g.played ? '<span class="stamp">Gespielt</span>' : ""}
    ${state.admin ? `<div class="admin-tools">
      <button class="icon-btn" data-act="played" title="${g.played ? "Als ungespielt markieren" : "Als gespielt markieren"}" aria-label="Gespielt umschalten">${I.eye}</button>
      <button class="icon-btn" data-act="edit" title="Bearbeiten" aria-label="Bearbeiten">${I.edit}</button></div>` : ""}
    <a class="cover" ${a} tabindex="-1" aria-hidden="true">${cover(g)}</a>
    <div class="card-body">
      ${(g.modes || []).length || g.earlyAccess ? `<div class="modes">${(g.modes || []).map(m => `<span class="mode">${esc(m)}</span>`).join("")}${g.earlyAccess ? '<span class="mode ea">Early Access</span>' : ""}</div>` : ""}
      <h3>${link ? `<a ${a}>${esc(g.title)}</a>` : esc(g.title)}</h3>

      ${(g.genres || []).length ? `<div class="tags">${g.genres.map(t => `<span class="tag" style="--h:${hueOf(t)}">${esc(t)}</span>`).join("")}</div>` : ""}
    </div></article>`;
}

function render() {
  const list = filtered();
  const rel = list.filter(g => g.released), unrel = list.filter(g => !g.released);
  const shown = state.tab === "released" ? rel : unrel;
  const used = new Set(GAMES.flatMap(g => g.genres || []));
  const tagOrder = [...GENRES.map(x => x[0]).filter(t => used.has(t)), ...[...used].filter(t => !GENRES.some(x => x[0] === t)).sort()];
  const total = GAMES.length;
  const focusId = document.activeElement?.id; const caret = document.activeElement?.selectionStart;
  root.innerHTML = `
  <header class="top"><div class="wrap">
    <div class="logo"><span class="dot" aria-hidden="true"></span>Stream-Games</div>
    <div class="top-right">
      <span class="count">${total} ${total === 1 ? "Spiel" : "Spiele"}</span>
      ${state.admin && downloadsApi ? `<button class="btn ghost" id="export" title="Lädt die index.html für die öffentliche Website herunter">Für Website exportieren</button>` : ""}
      ${state.admin ? `<button class="btn primary" id="add">${I.plus}Spiel hinzufügen</button>` : ""}
    </div>
  </div></header>
  <main class="wrap">
    <div class="filters">
      <label class="search">${I.search}<input id="q" type="search" placeholder="Suche" value="${esc(state.q)}" aria-label="Spiele durchsuchen"></label>
      <label class="check"><input id="played" type="checkbox" ${state.showPlayed ? "checked" : ""}>Gespielte anzeigen</label>
      <select id="mode" class="select" aria-label="Modus filtern">
        <option value="">Alle Modi</option>${MODES.map(m => `<option ${state.mode === m ? "selected" : ""}>${m}</option>`).join("")}
      </select>
    </div>
    ${tagOrder.length ? `<div class="chips" role="group" aria-label="Genres">${tagOrder.map(t => `<button class="chip" style="--h:${hueOf(t)}" data-tag="${esc(t)}" aria-pressed="${state.tags.has(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="released" aria-selected="${state.tab === "released"}">Released<span class="n">${rel.length}</span></button>
      <button class="tab" role="tab" data-tab="unreleased" aria-selected="${state.tab === "unreleased"}">Unreleased<span class="n">${unrel.length}</span></button>
    </div>
    <section class="grid">${shown.length ? shown.map(card).join("") : emptyState(total)}</section>
  </main>`;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch {} } }
}

function emptyState(total) {
  if (!total) return `<div class="empty"><strong>Noch keine Spiele</strong>${state.admin ? "Füg das erste über „Spiel hinzufügen“ hinzu – ein Steam- oder YouTube-Link reicht als Start." : "Hier tauchen bald die Spiele für den Stream auf."}</div>`;
  return `<div class="empty"><strong>Nichts gefunden</strong>Kein Spiel passt zu diesen Filtern${!state.showPlayed ? " (gespielte sind ausgeblendet)" : ""}.</div>`;
}

root.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; saveView(); render(); }
});
root.addEventListener("change", e => {
  if (e.target.id === "played") { state.showPlayed = e.target.checked; saveView(); render(); }
  if (e.target.id === "mode") { state.mode = e.target.value; saveView(); render(); }
});
root.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tag) { state.tags.has(t.dataset.tag) ? state.tags.delete(t.dataset.tag) : state.tags.add(t.dataset.tag); saveView(); render(); }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; saveView(); render(); }
  else if (t.id === "add") openEditor(null);
  else if (t.id === "export") exportSite(t);
  else if (t.dataset.act) {
    const g = GAMES.find(x => x.id === t.closest(".card").dataset.id); if (!g) return;
    if (t.dataset.act === "edit") openEditor(g);
    if (t.dataset.act === "played") { g.played = !g.played; save(g.played ? `„${g.title}“ als gespielt markiert` : `„${g.title}“ wieder offen`); }
  }
});

/* ---------- persistence: republish the page with the new data ---------- */
function buildDoc() {
  const reset = document.head.querySelector("style")?.textContent ?? "";
  const json = JSON.stringify(GAMES).replace(/</g, "\\u003c");
  const fonts = document.querySelector('link[rel="stylesheet"]')?.getAttribute("href") ?? "";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>'
    + '<meta name="claude:viewport-fit-sides" content="cover">\n<title>Stream-Games</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="' + fonts + '">\n'
    + '<style id="css">' + document.getElementById("css").textContent + '</style>\n<div id="root"></div>\n'
    + '<script id="data" type="application/json">' + json + '<\/script>\n'
    + '<script id="app">' + document.getElementById("app").textContent + '<\/script>\n</body></html>';
}
async function save(msg) {
  render();
  if (!artifactApi) { toast("Speichern ist in dieser Ansicht nicht möglich."); return; }
  try { sessionStorage.setItem("sg-toast", msg || "Gespeichert"); } catch {}
  try { await artifactApi.publish(buildDoc()); }
  catch (e) {
    try { sessionStorage.removeItem("sg-toast"); } catch {}
    if (e?.code === "conflict") toast("Jemand anderes hat gerade gespeichert – die Seite lädt neu.");
    else if (e?.code === "not_writer" || e?.code === "not_granted") { state.admin = false; render(); toast("Diese Ansicht ist schreibgeschützt."); }
    else if (e?.code === "too_large") toast("Zu groß zum Speichern – nimm kleinere Titelbilder.");
    else toast("Speichern hat nicht geklappt. Versuch es gleich nochmal.");
  }
}
/* the same page works standalone: outside Claude it simply shows the read-only list */
async function exportSite(btn) {
  if (!downloadsApi) return;
  btn.disabled = true;
  try { await downloadsApi.save({ filename: "index.html", data: new Blob([buildDoc()], { type: "text/html" }) }); toast("index.html gespeichert – jetzt bei Netlify hochladen."); }
  catch (e) { if (e?.code !== "cancelled" && e?.code !== "declined") toast("Export hat nicht geklappt."); }
  finally { btn.disabled = false; }
}
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 3200); }

/* ---------- editor ---------- */
function parseLink(url) {
  const s = (url || "").trim();
  let m = s.match(/store\.steampowered\.com\/app\/(\d+)(?:\/([^/?#]+))?/i);
  if (m) return { kind: "steam", appid: m[1], title: m[2] ? decodeURIComponent(m[2]).replace(/_/g, " ").trim() : "" };
  m = s.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i);
  if (m) return { kind: "youtube", id: m[1], title: "" };
  if (/^https?:\/\//i.test(s)) return { kind: "web", title: "" };
  return null;
}

function openEditor(game) {
  const g = game ? structuredClone(game) : { id: uid(), title: "", link: "", image: "", genres: [], modes: [], released: true, earlyAccess: false, releaseDate: "", played: false, note: "" };

          <div class="msg">Bild hier einfügen (Strg+V), hineinziehen oder klicken.<br><small>Tipp: Auf Steam Rechtsklick aufs Headerbild → „Bild kopieren“.</small></div>
        </div>
        <input type="file" id="f-file" accept="image/*" hidden>
        <div><button type="button" class="btn ghost" id="f-noimg" ${g.image ? "" : "hidden"}>Bild entfernen</button></div></div>
      <div class="field"><span class="lbl">Modus</span><div class="toggles" id="f-modes">${MODES.map(m => `<button type="button" class="toggle" data-v="${m}" aria-pressed="${g.modes.includes(m)}">${m}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Art des Spiels</span><div class="toggles" id="f-genres">${allGenres.map(t => `<button type="button" class="toggle g" style="--h:${hueOf(t)}" data-v="${esc(t)}" aria-pressed="${g.genres.includes(t)}">${esc(t)}</button>`).join("")}</div>
        <div class="linkrow"><input id="f-newgenre" placeholder="Eigenes Genre"><button type="button" class="btn" id="f-addgenre">Hinzufügen</button></div></div>
      <div class="row">
        <div class="field"><span class="lbl">Status</span><div class="seg" id="f-rel"><button type="button" data-v="1" aria-pressed="${!!g.released}">Released / spielbar</button><button type="button" data-v="0" aria-pressed="${!g.released}">Unreleased</button></div></div>
        <div class="field" id="f-datewrap" ${g.released ? "hidden" : ""}><label for="f-date">Release-Termin</label><input id="f-date" placeholder="z. B. 2027 oder 14. März 2027" value="${esc(g.releaseDate)}"></div>
      </div>
      <div class="field"><label for="f-note">Notiz (optional)</label><input id="f-note" placeholder="z. B. mit Basti" value="${esc(g.note)}"></div>
      <div class="checks"><label class="check"><input type="checkbox" id="f-ea" ${g.earlyAccess ? "checked" : ""}>Early Access</label>
      <label class="check"><input type="checkbox" id="f-played" ${g.played ? "checked" : ""}>Schon gespielt</label></div>
    </div>
    <div class="dlg-foot">
      ${game ? `<button type="button" class="btn danger" id="f-del">Löschen</button>` : ""}
      <div class="right"><button type="button" class="btn ghost" data-close>Abbrechen</button><button type="submit" class="btn primary" id="f-save">Speichern</button></div>
    </div></form>`;
  document.body.append(dlg);
  const $ = s => dlg.querySelector(s);
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.addEventListener("cancel", e => { e.preventDefault(); close(); });
  dlg.querySelectorAll("[data-close]").forEach(b => b.onclick = close);

  const linkIn = $("#f-link"), titleIn = $("#f-title"), aiBtn = $("#f-ai"), aiHint = $("#f-ai-hint");
  let steamOff = false;
  const hint = (t, cls = "") => { aiHint.textContent = t; aiHint.className = "hint " + cls; };
  const onLink = () => {
    const p = parseLink(linkIn.value);
    if (p?.title && !titleIn.value.trim()) titleIn.value = p.title;
    const steamMode = p?.kind === "steam" && !!mcpApi && !steamOff;
    aiBtn.textContent = steamMode ? "Von Steam laden" : "Mit Claude ausfüllen";
    aiBtn.hidden = !(steamMode || sampleApi) || !(linkIn.value.trim() || titleIn.value.trim());
    if (p?.kind === "steam") hint("Steam-Link erkannt" + (p.title ? `: ${p.title}` : "") + ".", "ok");
    else if (p?.kind === "youtube") hint("YouTube-Link erkannt – trag den Spieltitel ein, dann kann Claude den Rest vorschlagen.", "ok");
    else hint("");
  };
  linkIn.addEventListener("input", onLink); titleIn.addEventListener("input", onLink); onLink();

  const setToggles = (box, vals) => box.querySelectorAll(".toggle").forEach(b => b.setAttribute("aria-pressed", vals.includes(b.dataset.v)));
  const readToggles = box => [...box.querySelectorAll('.toggle[aria-pressed="true"]')].map(b => b.dataset.v);
  dlg.addEventListener("click", e => { const b = e.target.closest(".toggle"); if (b) b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); });
  const addGenre = name => {
    name = name.trim(); if (!name) return;
    const box = $("#f-genres");
    let b = [...box.children].find(x => x.dataset.v.toLowerCase() === name.toLowerCase());
    if (!b) { b = document.createElement("button"); b.type = "button"; b.className = "toggle g"; b.style.setProperty("--h", hueOf(name)); b.dataset.v = name; b.textContent = name; box.append(b); }
    b.setAttribute("aria-pressed", "true");
  };
  $("#f-addgenre").onclick = () => { addGenre($("#f-newgenre").value); $("#f-newgenre").value = ""; };
  $("#f-newgenre").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#f-addgenre").click(); } });

  const setRel = r => { g.released = r; $("#f-rel").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", (b.dataset.v === "1") === r)); $("#f-datewrap").hidden = r; };
  $("#f-rel").onclick = e => { const b = e.target.closest("button"); if (b) setRel(b.dataset.v === "1"); };

  /* image: paste / drop / pick → downscaled JPEG data URL */
  const drop = $("#f-drop"), file = $("#f-file");
  const setImage = url => { g.image = url; drop.querySelector("img")?.remove(); if (url) { const im = new Image(); im.src = url; im.alt = ""; drop.prepend(im); } drop.classList.toggle("has", !!url); $("#f-noimg").hidden = !url; };
  const takeFile = async f => {
    if (!f || !f.type.startsWith("image/")) { hint("Das war kein Bild. Kopier das Bild selbst, nicht den Link dazu.", "err"); return; }
    try { setImage(await shrink(f)); hint("Bild übernommen.", "ok"); } catch { hint("Das Bild ließ sich nicht lesen.", "err"); }
  };
  drop.onclick = () => file.click();
  drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } };
  file.onchange = () => takeFile(file.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) takeFile(f); else hint("Aus anderen Tabs kommt beim Ziehen nur ein Link an. Kopier das Bild stattdessen und füg es mit Strg+V ein.", "err"); };
  dlg.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith("image/")); if (f) { e.preventDefault(); takeFile(f); } });
  $("#f-noimg").onclick = () => setImage("");

  /* Claude autofill */
  aiBtn.onclick = async () => {
    const p = parseLink(linkIn.value) || {};
    if (p.kind === "steam" && mcpApi && !steamOff) {
      aiBtn.disabled = true;
      try {
        const d = await steamFetch(p.appid, t => hint(t));
        titleIn.value = d.title || titleIn.value;
        setToggles($("#f-modes"), d.modes);
        $("#f-ea").checked = d.earlyAccess;
        setRel(d.released);
        $("#f-date").value = d.released ? "" : d.releaseDate;
        if (d.image) setImage(d.image);
        setToggles($("#f-genres"), []);
        let genres = d.fallbackGenres;
        if (sampleApi) {
          hint("Claude ordnet das Genre ein …");
          try { const g = await pickGenres(d); if (g.length) genres = g; } catch {}
        }
        genres.forEach(addGenre);
        hint(d.image ? "Von Steam übernommen – kurz prüfen und speichern." : "Daten von Steam übernommen. Das Titelbild bitte noch per Strg+V einfügen.", "ok");
      } catch (e) {
        const msg = steamErrorText(e);
        if (e?.code === "server_not_connected" || e?.code === "not_granted" || e?.code === "capability_disabled") { steamOff = true; onLink(); }
        hint(msg, "err");
      } finally { aiBtn.disabled = false; }
      return;
    }
    const name = titleIn.value.trim() || p.title || "";
    aiBtn.disabled = true; hint("Claude überlegt …");
    const prompt = `Du hilfst, eine Spieleliste für einen Twitch-Streamer zu pflegen. Ordne dieses Spiel ein.
Titel: ${name || "(unbekannt)"}
Link: ${linkIn.value.trim() || "(keiner)"}${p.appid ? `\nSteam-AppID: ${p.appid}` : ""}
Heute ist ${new Date().toISOString().slice(0, 10)}.

Antworte nur mit JSON in genau dieser Form:
{"title": string, "genres": string[], "modes": string[], "released": boolean, "earlyAccess": boolean, "releaseDate": string, "known": boolean}
- released: true, sobald man das Spiel spielen kann – auch im Early Access. false nur, wenn es noch gar nicht spielbar ist (eine Demo zählt nicht)
- earlyAccess: true, wenn das Spiel aktuell im Early Access ist
- Wenn du das Spiel nicht sicher kennst: released = true und known = false (es hat ja schon eine Store-Seite)
- genres: 1–3 aus dieser Liste, nur wenn nichts passt ein eigenes kurzes deutsches Wort: ${GENRES.map(x => x[0]).filter(x => x !== "Neu Release").join(", ")}
- modes: Teilmenge von ${MODES.join(", ")} (Koop = gemeinsames Spielen, online oder lokal)
- releaseDate: bei unveröffentlichten Spielen der angekündigte Termin auf Deutsch, sonst ""
- known: false, wenn du das Spiel nicht sicher kennst (dann vorsichtig schätzen)`;
    try {
      const r = await sampleApi.json(prompt);
      if (r && typeof r === "object") {
        if (r.title && !titleIn.value.trim()) titleIn.value = String(r.title);
        if (Array.isArray(r.genres)) { setToggles($("#f-genres"), []); r.genres.slice(0, 4).forEach(x => addGenre(String(x))); }
        if (Array.isArray(r.modes)) setToggles($("#f-modes"), r.modes.map(String));
        if (typeof r.earlyAccess === "boolean") $("#f-ea").checked = r.earlyAccess;
        if (r.known === true && typeof r.released === "boolean") setRel(r.released || r.earlyAccess === true);
        else setRel(true);
        if (r.releaseDate) $("#f-date").value = String(r.releaseDate);
        hint(r.known === false ? "Claude kennt das Spiel nicht sicher – Status steht auf Released, bitte kurz prüfen." : "Vorschlag eingetragen – kurz prüfen und speichern.", r.known === false ? "err" : "ok");
      }
    } catch (e) {
      if (e?.code === "not_granted" || e?.code === "sampling_disabled") { aiBtn.hidden = true; hint("Claude ist in dieser Ansicht nicht verfügbar."); }
      else if (e?.code === "rate_limited") hint("Gerade zu viele Anfragen – gleich nochmal versuchen.", "err");
      else if (e?.code !== "cancelled") hint("Das hat nicht geklappt. Nochmal versuchen oder selbst ausfüllen.", "err");
    } finally { aiBtn.disabled = false; }
  };

  const del = $("#f-del");
  if (del) del.onclick = () => {
    if (!confirmDel) { confirmDel = true; del.textContent = "Wirklich löschen?"; return; }
    const i = GAMES.findIndex(x => x.id === g.id); if (i >= 0) GAMES.splice(i, 1);
    close(); save(`„${g.title}“ gelöscht`);
  };

  dlg.querySelector("form").addEventListener("submit", e => {
    e.preventDefault();
    const title = titleIn.value.trim(); if (!title) { titleIn.focus(); return; }
    Object.assign(g, {
      title, link: linkIn.value.trim(), modes: readToggles($("#f-modes")), genres: readToggles($("#f-genres")),
      releaseDate: g.released ? "" : $("#f-date").value.trim(), note: $("#f-note").value.trim(), played: $("#f-played").checked, earlyAccess: $("#f-ea").checked
    });
    const i = GAMES.findIndex(x => x.id === g.id);
    if (i >= 0) GAMES[i] = g; else { g.addedAt = Date.now(); GAMES.push(g); state.tab = g.released ? "released" : "unreleased"; saveView(); }
    close(); save(`„${title}“ gespeichert`);
  });
  dlg.showModal(); (game ? titleIn : linkIn).focus();
}

/* ---------- Steam via the Claude app's built-in browser ---------- */
const HB = "host:claude_browser";
let steamTab = null;
const textOf = r => (r?.content || []).filter(b => b.type === "text").map(b => b.text).join("\n") || (typeof r?.payload === "string" ? r.payload : "");
const imageOf = r => (r?.content || []).find(b => b.type === "image" && b.data);
function steamErrorText(e) {
  switch (e?.code) {
    case "server_not_connected": return "Steam-Abruf geht nur, wenn du die Seite in der Claude Desktop-App öffnest. Hier kannst du „Mit Claude ausfüllen“ nutzen.";
    case "not_in_manifest": case "approval_required": case "cancelled": return "Der Zugriff auf den Browser wurde nicht erlaubt. Klick nochmal und bestätige die Abfrage in der App.";
    case "tool_error": return /allow|erlaub|permission/i.test(e.message || "") ? "Erlaube Steam in der Abfrage der Desktop-App und klick dann nochmal." : "Der Browser meldet einen Fehler: " + String(e.message || "unbekannt").replace(/\s+/g, " ").slice(0, 160);
    case "steam_missing": return "Steam kennt diese App-ID nicht. Ist der Link richtig?";
    case "steam_parse": return "Die Steam-Antwort ließ sich nicht lesen. Versuch es nochmal.";
    default: return "Steam-Abruf hat nicht geklappt (" + (e?.code || "?") + "). Versuch es nochmal oder füll selbst aus.";
  }
}
async function steamFetch(appid, step) {
  step("Steam-Daten werden geladen …");
  const url = `https://store.steampowered.com/api/appdetails?appids=${encodeURIComponent(appid)}&l=german&cc=de&filters=basic,genres,categories,release_date`;
  /* reuse one browser tab for every lookup instead of opening a new one each time */
  let tab = steamTab, opened = false;
  if (tab) {
    try { await mcpApi.callTool(HB, "navigate", { url, tabId: tab }, { cache: false }); opened = true; }
    catch (e) { if (e?.code !== "tool_error") throw e; tab = null; }
  }
  if (!opened) {
    /* the fronted tab (navigate opens the pane if needed) – avoids piling up new tabs */
    try { await mcpApi.callTool(HB, "navigate", { url }, { cache: false }); opened = true; }
    catch (e) { if (e?.code !== "tool_error") throw e; }
  }
  if (!opened) {
    const r = await mcpApi.callTool(HB, "preview_start", { url }, { cache: false });
    tab = (textOf(r).match(/tabId\s+([^\s)]+)/) || [])[1] || null;
  }
  steamTab = tab;
  const withTab = o => tab ? { ...o, tabId: tab } : o;
  const txt = textOf(await mcpApi.callTool(HB, "get_page_text", withTab({ max_chars: 300000 }), { cache: false }));
  let j;
  try { j = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1)); } catch { throw { code: "steam_parse" }; }
  const d = j?.[appid]?.data;
  if (!j?.[appid]?.success || !d) throw { code: "steam_missing" };
  const cats = new Set((d.categories || []).map(c => Number(c.id)));
  const modes = [];
  if (cats.has(2)) modes.push("Singleplayer");
  if ([9, 38, 39, 48].some(x => cats.has(x))) modes.push("Koop");
  if ([24, 37, 39].some(x => cats.has(x))) modes.push("Splitscreen");
  if ([1, 36, 49, 47].some(x => cats.has(x))) modes.push("Multiplayer");
  const steamGenres = (d.genres || []).map(x => x.description);
  const map = { "Simulationen": "Simulator", "Strategie": "Strategie", "Rennspiele": "Rennspiel" };
  const out = {
    title: d.name || "", modes, steamGenres,
    earlyAccess: (d.genres || []).some(x => String(x.id) === "70"),
    released: !d.release_date?.coming_soon,
    releaseDate: d.release_date?.date || "",
    about: String(d.short_description || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").slice(0, 700),
    fallbackGenres: [...new Set(steamGenres.map(x => map[x]).filter(Boolean))],
    image: ""
  };
  if (d.header_image) {
    try {
      step("Titelbild wird geholt …");
      /* show the header enlarged (wsrv.nl image proxy) so the capture keeps its detail; plain header as fallback */
      const big = `https://wsrv.nl/?url=${encodeURIComponent(String(d.header_image).replace(/^https?:\/\//, ""))}&w=1840&output=png`;
      try { await mcpApi.callTool(HB, "navigate", withTab({ url: big }), { cache: false }); }
      catch { await mcpApi.callTool(HB, "navigate", withTab({ url: d.header_image }), { cache: false }); }
      const shotRes = await mcpApi.callTool(HB, "computer", withTab({ action: "screenshot" }), { cache: false });
      const shot = imageOf(shotRes);
      if (shot) {
        const src = `data:${shot.mimeType || "image/png"};base64,${shot.data}`;
        const box = await findBox(src);
        if (box) {
          out.image = await cropTo(src, box);
          /* re-capture just the picture at full resolution for a sharp result */
          try {
            const fm = textOf(shotRes).match(/coordinate frame:\s*(\d+)\s*x\s*(\d+)/i);
            const sx = fm ? Number(fm[1]) / box.W : 1, sy = fm ? Number(fm[2]) / box.H : 1;
            const region = [Math.ceil(box.x * sx) + 1, Math.ceil(box.y * sy) + 1, Math.floor((box.x + box.w) * sx) - 1, Math.floor((box.y + box.h) * sy) - 1];
            const z = imageOf(await mcpApi.callTool(HB, "computer", withTab({ action: "zoom", region, scale: 1 }), { cache: false }));
            if (z) {
              const zsrc = `data:${z.mimeType || "image/png"};base64,${z.data}`;
              const sharp = await cropTo(zsrc, null);
              if (sharp) out.image = sharp;
            }
          } catch {}
        }
      }
    } catch {}
  }
  return out;
}
/* the image viewer shows the header centered on a flat background: find it */
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
async function findBox(src) {
  const img = await loadImg(src).catch(() => null); if (!img) return null;
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const px = x.getImageData(0, 0, W, H).data, bg = [px[0], px[1], px[2]];
  const off = i => Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) > 30;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    if (off((y * W + xx) * 4)) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  if (w < 120 || h < 50 || w / h < 1.8 || w / h > 2.5) return null;
  return { x: x0, y: y0, w, h, W, H };
}
async function cropTo(src, box) {
  const img = await loadImg(src).catch(() => null); if (!img) return "";
  const b = box || { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
  const tw = Math.min(b.w, 920), th = Math.round(b.h * tw / b.w);
  const o = document.createElement("canvas"); o.width = tw; o.height = th;
  const g = o.getContext("2d"); g.imageSmoothingQuality = "high";
  g.drawImage(img, b.x, b.y, b.w, b.h, 0, 0, tw, th);
  return o.toDataURL("image/jpeg", 0.9);
}
async function pickGenres(d) {
  const list = GENRES.map(x => x[0]).filter(x => x !== "Neu Release");
  const r = await sampleApi.json(`Ordne dieses Steam-Spiel für die Spieleliste eines Twitch-Streamers ein.
Name: ${d.title}
Steam-Genres: ${d.steamGenres.join(", ") || "-"}
Modi: ${d.modes.join(", ") || "-"}
Beschreibung: ${d.about || "-"}

Wähle 1–3 passende Kategorien aus dieser Liste: ${list.join(", ")}.
"Friendslop" = chaotisches, lustiges Koop-Spiel für Freundesgruppen. Nur wenn wirklich nichts passt, ein eigenes kurzes deutsches Wort.
Antworte nur mit einem JSON-Array von Strings, z. B. ["Simulator","Friendslop"].`, { modelTier: "quick" });
  return Array.isArray(r) ? r.map(String).slice(0, 3) : [];
}

function shrink(fileOrBlob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(fileOrBlob), img = new Image();
    img.onload = () => {
      const W = 920, scale = Math.min(1, W / img.naturalWidth);
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

render();
try { const t = sessionStorage.getItem("sg-toast"); if (t) { sessionStorage.removeItem("sg-toast"); toast(t); } } catch {}

(async () => {
  const c = window.claude; if (!c?.use) return;
  const [user, art, smp, mcp, dl] = await Promise.all([c.use("user"), c.use("artifact"), c.use("sample"), c.use("mcp"), c.use("downloads")]);
  artifactApi = art; sampleApi = smp; mcpApi = mcp; downloadsApi = dl;
  const canEdit = user ? await user.canEdit() : false;
  if (canEdit && art) { state.admin = true; render(); }
})();
})();
